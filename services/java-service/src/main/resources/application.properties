server.port=${FEATURE_PORT:8201}
spring.application.name=feature-service

# MUST match train/data.py. Configured rather than hard-coded so a change in training
# is a deploy-time config diff, not a silent accuracy collapse.
forge.norm.mean=${FORGE_NORM_MEAN:0.2860}
forge.norm.std=${FORGE_NORM_STD:0.3530}

management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.probes.enabled=true
